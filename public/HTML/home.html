<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Home Page</title>

            <link rel="stylesheet" href="../CSS/main.css">
            <link rel="stylesheet" href="../CSS/Home.css">
            <link rel="icon" type="image/svg+xml" href="../Files/branding/logo.svg">

    </head>

    <body>

        <header>
        <a class="logo-area" href="home.html"><img src="../Files/branding/logo.svg" alt="" class="Herologo"><span>Our Home Hub</span></a>
        <nav class="navigationlinks" aria-label="Main navigation">
            <a href="home.html" class="nav-link" aria-current="page">Home</a>
            <a href="inventory.html" class="nav-link">Inventory</a>
            <a href="todos.html" class="nav-link">To Do's</a>
            <a href="placestogo.html" class="nav-link">Places to Go</a>
            <button id="logout-button" type="button">Logout</button>
        </nav>
    </header>

        <main class="homepage">

            <section class="welcome-section">

                <h2>Welcome Home!</h2>
                <p>What would you like to do today?</p>

            </section>

        
            <section class="Dashboard">

                <h2>YOUR DASHBOARD</h2>

                <p>Get quick access to the tools you need.</p>

            </section>

            <section class="cardssection">

                <div class="feature-card Inventory">

                    <img src="../Files/branding/inventory.svg" alt="Inventory Icon" class="card-icon inventoryicon">

                    <div class="card-content">
                    
                        <h2>Check Inventory</h2>

                        <a href="inventory.html" class="card-button">Open Inventory →</a>

                    </div>
                </div>

                <div class="feature-card Todos">

                    <img src="../Files/branding/todos.svg" alt="Icon for todo's" class="card-icon todolisticon">

                    <div class="card-content">
                    
                        <h2>To-do List</h2>

                        <a href="todos.html" class="card-button">Open To-do List →</a>

                    </div> 

                </div>

                <div class="feature-card Places">

                    <img src="../Files/branding/places.svg" alt="Icon of places to go" class="card-icon">

                    <div class="card-content">
                    
                        <h2>Find Places to Go </h2>

                        <a href="placestogo.html" class="card-button">Find/Add Places →</a>

                    </div> 

                </div>

            </section>


        </main>


    <footer>

    </footer>

    <script type="module" src="../JS/home.js"></script>

    </body>

</html>
